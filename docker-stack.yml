# TRMission — Portainer / Docker Swarm stack
#
# Deploy via Portainer UI → Stacks → Add Stack → paste this file, or:
#   docker stack deploy -c docker-stack.yml trmission
#
# Prerequisites:
#   1. Build and push the two app images first:
#        docker build -f Dockerfile.server -t <registry>/trm-server:latest .
#        docker build -f apps/web/Dockerfile -t <registry>/trm-web:latest .
#        docker push <registry>/trm-server:latest
#        docker push <registry>/trm-web:latest
#   2. Set JWT_SECRET in Portainer → Stacks → Environment variables
#      (or via `docker secret` and reference it below).
#
version: '3.8'

services:
  mongo:
    image: mongo:7
    # No published port: the server service reaches this over the stack's internal
    # overlay network at mongodb://mongo:27017 (see the `server` service's MONGO_URL
    # below). Do not publish 27017 here — Mongo runs with no authentication configured,
    # so exposing it on the host/ingress network gives anyone who can route to the node
    # unauthenticated read/write on the game database.
    volumes:
      - trm-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: any

  server:
    image: <registry>/trm-server:latest # replace with your image
    environment:
      PORT: '3001'
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: trmission
      JWT_SECRET: ${JWT_SECRET} # set in Portainer env vars
      # Cross-origin browser clients only. The web tier serves the SPA and proxies /api + /ws from
      # ONE origin, so a same-origin deployment needs nothing here — the ws upgrade admits
      # same-origin requests on its own (ws-server.ts) and REST CORS never engages. Set it to your
      # public origin (e.g. https://trmission.example) only if something cross-origin must connect.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Public base URL the browser reaches this stack at — required for the OAuth round trip
      # (provider redirect_uri + post-callback redirect). Must be the origin serving the SPA.
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-}
      # Refresh/OAuth-nonce cookies get Secure by default (assumes HTTPS in front of this
      # service, e.g. a TLS-terminating proxy/load balancer). Only set to 0 for an http-only
      # deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # Maintainer dashboard owners (comma-separated users._id values, NOT emails; served at /admin/).
      DASHBOARD_OWNER_IDS: ${DASHBOARD_OWNER_IDS:-}
      # Sentry (issue #44) — entirely opt-in: an unset DSN means the SDK is never initialised.
      # SENTRY_TRACES_SAMPLE_RATE is 0–1 (default 0.1); /metrics and /healthz are never traced.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    ports:
      - '3001:3001'
    deploy:
      restart_policy:
        condition: any

  web:
    # The web/admin bundles bake their Sentry DSN at BUILD time (Vite), so there is nothing to set
    # here — pass --build-arg SENTRY_DSN=... when building the image.
    image: <registry>/trm-web:latest # replace with your image
    ports:
      - '8080:80'
    deploy:
      restart_policy:
        condition: any

volumes:
  trm-mongo-data:
