# Publishes a JS-ONLY over-the-air update to the self-hosted expo-open-ota server.
# Never used for native changes: runtimeVersion=fingerprint means a bundle exported from a
# tree whose native fingerprint differs from the installed binary is simply ignored by it.
# Store binaries ship via mobile-android.yml / mobile-ios.yml (P6).
# Runbook: docs/mobile/ota.md
name: mobile-ota
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel (expo-open-ota branch)'
        type: choice
        options: [production, preview]
        default: preview
  push:
    tags: ['mobile-ota-v*']

concurrency:
  group: mobile-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-yarn
      # proto codegen must exist before any workspace build (src/gen is gitignored).
      - run: yarn workspace @trm/proto generate

      # Only the packages that can actually END UP in this update. apps/{web,admin,server} cannot —
      # the lane ships one Metro bundle of @trm/mobile — and checking them was ~12s of the job, most
      # of it @trm/web's Vite build (turbo's `typecheck` dependsOn `^build`). Negative filters rather
      # than `--filter=@trm/mobile...` on purpose: src/offline imports @trm/bots without declaring
      # it in apps/mobile/package.json, so a dependency-graph filter would silently drop it.
      - name: Typecheck everything that can reach the bundle
        run: yarn turbo run typecheck --filter='!@trm/web' --filter='!@trm/admin' --filter='!@trm/server'

      # `expo export` with no --platform exports every platform in the RESOLVED app config, and
      # `platforms` is auto-derived from what's installed — react-native-web (the RNW desktop
      # harness, apps/mobile/CLAUDE.md) puts `web` in it. So every publish also bundled an 8.3MB web
      # bundle that @expo/cli then throws away: createMetadataJson does `if (platform === 'web')
      # return metadata`, so it never enters metadata.json, is never uploaded, and no device can
      # ever receive it. It only competed with the android/ios bundles for the runner's 4 vCPUs —
      # measured at `Web Bundled 114015ms` inside a 185s export.
      #
      # Dropping `web` from `platforms` in app.config.ts would be the obvious fix and is NOT safe:
      # the resolved config feeds the runtimeVersion fingerprint, so it would strand every installed
      # binary — issue #55 again. Constrain the export at the CLI instead. `expo export --platform`
      # is repeatable, and eoas spawns the Expo CLI through a configurable "package runner"
      # (`<runner> expo <subcommand> …`, verified in eoas 3.0.5 publish.js + lib/expoConfig.js), so a
      # pass-through shim can append the platform list to `export` alone and leave `expo config`
      # untouched. eoas' runner validator rejects anything but bare words — no slashes — hence a
      # binary on PATH rather than a path to a script. If a future eoas changes that spawn shape the
      # shim just passes everything through, i.e. it degrades to today's behaviour, never to a
      # broken publish.
      - name: Shim eoas' Expo CLI runner so the export skips the web platform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/npx-native-only" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1-}" = expo ] && [ "${2-}" = export ]; then
            exec npx "$@" --platform android --platform ios
          fi
          exec npx "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/npx-native-only"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Traceability: the runtime versions this update actually targets — resolved exactly the way
      # eoas resolves them (the project's own expo-updates CLI, PER PLATFORM, managed workflow
      # because android/ios are CNG). Deliberately not `npx @expo/fingerprint .`: that hashes the
      # whole project across all platforms and yields a different value than any manifest ever
      # carries, which makes it useless for "did my probe target the right runtime version".
      #
      # The env must match the publish step below: the runtime version is computed from the
      # evaluated app config, so a missing var here would record versions nothing was published under.
      # Writes into the workspace, so the path is gitignored (apps/mobile/.gitignore) — the publish
      # step aborts on a dirty working tree, and an untracked file here fails the whole lane.
      - name: Record the runtime versions this update targets (traceability)
        working-directory: apps/mobile
        env:
          TRM_OTA_URL: ${{ vars.TRM_OTA_URL }}
          TRM_OTA_APP_ID: ${{ vars.TRM_OTA_APP_ID }}
          TRM_OTA_CHANNEL: ${{ inputs.channel || 'production' }}
          TRM_SERVER_ORIGIN: ${{ vars.TRM_SERVER_ORIGIN }}
          TRM_GOOGLE_WEB_CLIENT_ID: ${{ vars.TRM_GOOGLE_WEB_CLIENT_ID }}
          TRM_GOOGLE_IOS_CLIENT_ID: ${{ vars.TRM_GOOGLE_IOS_CLIENT_ID }}
          TRM_GOOGLE_IOS_URL_SCHEME: ${{ vars.TRM_GOOGLE_IOS_URL_SCHEME }}
          # Sentry (issue #44) — every one optional; unset ⇒ the SDK is never initialised and the
          # upload steps no-op. TRM_SENTRY_* land in `extra` (runtime config, read by
          # src/config.ts) and so must appear in EVERY block that re-evaluates app.config.ts,
          # exactly like the Google client ids above.
          TRM_SENTRY_DSN: ${{ vars.TRM_SENTRY_DSN }}
          TRM_SENTRY_ENVIRONMENT: ${{ vars.TRM_SENTRY_ENVIRONMENT }}
          TRM_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.TRM_SENTRY_TRACES_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE }}
        run: |
          # Every env var that feeds the fingerprint must be set here, or this publish targets a
          # runtime version built from placeholder fallbacks that no store binary ever computes
          # (issue #62 — the store side of that gate is in mobile-{android,ios}.yml).
          node scripts/fingerprintEnv.js --assert
          # Prime the npx cache for the publish step while the fingerprints resolve. Installing
          # eoas + its dependency tree is ~16s of dead time at the head of that step and depends on
          # nothing in this project; the identical spec string resolves to the same ~/.npm/_npx
          # entry, so the real invocation below starts instantly. Waited on explicitly (not bare
          # `wait`, which swallows child status) so a failed download fails HERE rather than
          # halfway through a publish.
          npx --yes eoas@3.0.5 --version >/dev/null &
          eoas_prefetch=$!
          for platform in android ios; do
            npx expo-updates runtimeversion:resolve --platform "$platform" --workflow managed \
              | jq -c --arg platform "$platform" '{($platform): .runtimeVersion}'
          done | jq -s add | tee runtime-versions.json
          wait "$eoas_prefetch"

      - name: Publish to the OTA server
        working-directory: apps/mobile
        env:
          # eoas resolves the OTA server from the app config's updates.url origin, so this
          # must be the real deployment's manifest URL (repo variable), not the localhost default.
          TRM_OTA_URL: ${{ vars.TRM_OTA_URL }}
          # The app the update belongs to (expo-open-ota v3 is multi-app). `eoas publish` reads it
          # from the config's updates.requestHeaders['expo-app-id'] and posts to
          # <origin>/<appId>/requestUploadUrl/<branch>; without it the publish aborts. It is also a
          # fingerprint input, so it must match the store lanes exactly (mobile-android/ios.yml).
          TRM_OTA_APP_ID: ${{ vars.TRM_OTA_APP_ID }}
          # Bake the channel we are publishing TO. `expo-channel-name` lives in
          # updates.requestHeaders, which is a fingerprint input — so exporting with the default
          # `production` while publishing to `preview` would stamp the update with the
          # production-flavoured runtime version, and no preview binary would ever match it.
          # (Store binaries set nothing and therefore bake `production`, matching a production
          # publish; a `preview` ring only works for binaries built with TRM_OTA_CHANNEL=preview.)
          TRM_OTA_CHANNEL: ${{ inputs.channel || 'production' }}
          # eoas' `expo export` re-evaluates app.config.ts, and an applied update's manifest
          # REPLACES the binary's `Constants.expoConfig.extra` at runtime — publishing without
          # these would wipe the baked Google client ids (hiding the Google sign-in button) and
          # any non-default server origin from every device that applies the update. Keep in
          # lockstep with the build lanes' env blocks (mobile-ios.yml / mobile-android.yml).
          TRM_SERVER_ORIGIN: ${{ vars.TRM_SERVER_ORIGIN }}
          TRM_GOOGLE_WEB_CLIENT_ID: ${{ vars.TRM_GOOGLE_WEB_CLIENT_ID }}
          TRM_GOOGLE_IOS_CLIENT_ID: ${{ vars.TRM_GOOGLE_IOS_CLIENT_ID }}
          TRM_GOOGLE_IOS_URL_SCHEME: ${{ vars.TRM_GOOGLE_IOS_URL_SCHEME }}
          # Sentry (issue #44) — every one optional; unset ⇒ the SDK is never initialised and the
          # upload steps no-op. TRM_SENTRY_* land in `extra` (runtime config, read by
          # src/config.ts) and so must appear in EVERY block that re-evaluates app.config.ts,
          # exactly like the Google client ids above.
          TRM_SENTRY_DSN: ${{ vars.TRM_SENTRY_DSN }}
          TRM_SENTRY_ENVIRONMENT: ${{ vars.TRM_SENTRY_ENVIRONMENT }}
          TRM_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.TRM_SENTRY_TRACES_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE }}
          # Source-map upload for the OTA bundle `expo export` produces. With no auth token
          # SENTRY_DISABLE_AUTO_UPLOAD keeps it from failing the publish for anyone without a
          # Sentry account.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_MOBILE_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
          # Expo robot token — authenticates eoas + the channel→branch mapping. Updates are
          # signed at SERVE time by the OTA server's mounted private key; CI holds no
          # signing material (there is deliberately no code-signing secret here).
          #
          # eoas 3.x picks its auth from the env: EOO_TOKEN (a token minted by the OTA server's own
          # dashboard) switches it to "eoo" mode, otherwise it falls back to the Expo path, which
          # reads exactly this EXPO_TOKEN (its error string says EXPO_ACCESS_TOKEN; the code reads
          # EXPO_TOKEN — verified in eoas 3.0.5 dist/lib/auth.js). Keep using the Expo robot token:
          # the server already authenticates against the Expo API for channel→branch mapping.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # eoas runs its own `expo export` before uploading — no separate export step; --outputDir
        # retains the exported bundle for the artifact below. --packageRunner routes that export
        # through the shim installed above, which pins it to android+ios (see that step for why the
        # app config can't express this). Tag pushes have no inputs → production.
        #
        # The CLI is PINNED to the same version as the deployed server image (docs/mobile/ota.md):
        # eoas and expo-open-ota ship from one repo and only work in matched pairs — the upload route
        # moved to <origin>/<appId>/requestUploadUrl/<branch> in v3, so a v2 CLI against a v3 server
        # 404s and a v3 CLI against a v2-shaped config aborts on the missing expo-app-id.
        # Bump this only together with the server image, then re-verify per docs/release/ota-server-setup.md.
        run: |
          node scripts/fingerprintEnv.js --assert
          npx --yes eoas@3.0.5 publish \
            --branch ${{ inputs.channel || 'production' }} \
            --nonInteractive \
            --packageRunner npx-native-only \
            --outputDir dist \
            --message "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ota-bundle-${{ github.run_number }}
          path: |
            apps/mobile/dist
            apps/mobile/runtime-versions.json
          retention-days: 30
