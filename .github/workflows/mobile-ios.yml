name: mobile-ios

# macOS runners bill ~10x on private plans, so this lane is gated to release branches/tags (plus
# a twice-weekly cache warm-up on main — see the schedule note below). Continuous Native
# Generation: ios/ is produced by `expo prebuild`, never committed. Signing via fastlane match
# (certs/profiles in a private git repo, seeded by the mobile-ios-certs workflow — no Mac, no EAS).
# Every run produces an .ipa artifact; a real v<semver>+<build> tag also uploads to TestFlight, and
# so does a manual workflow_dispatch run with publish=true + build_number (same publish gate as
# mobile-android.yml).
on:
  push:
    branches: ['release/**']
    tags: ['v*']
  # Actions caches are ref-scoped: a run reads only its own ref's caches plus the default branch's,
  # so a cache saved on a release tag is unreadable by every later tag. The only ccache/Pods entries
  # a release build can restore are the ones a main-branch run leaves behind — that is what this
  # warm-up is for (and it is free despite the macOS multiplier: this repo is public, so
  # GitHub-hosted minutes aren't billed). A scheduled run takes the plain non-tag path —
  # BUILD_NUMBER=1, upload:false — and can never reach TestFlight. Daily, not twice-weekly (issue
  # #46): the shared 10GB repo cache budget evicts these entries by LRU well before GitHub's 7-day
  # idle expiry.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload this build to TestFlight'
        type: boolean
        default: false
      build_number:
        description: 'BUILD_NUMBER (CFBundleVersion) to stamp — required when publish is enabled, since a manual run has no v<semver>+<build> tag to derive one from (docs/release/mobile-versioning.md)'
        type: string
        default: ''
      app_version:
        description: 'APP_VERSION (CFBundleShortVersionString, e.g. 1.0.0) to stamp — required when publish is enabled, since a manual run has no v<semver>+<build> tag to derive one from (docs/release/mobile-versioning.md)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    # macos-26, not macos-latest: the Liquid Glass `.icon` bundle (app.config.ts ios.icon) needs
    # Xcode 26's actool — the macos-latest label only finishes flipping to macOS 26 during the
    # June 2026 rollout, and a stray macOS 15 (Xcode 16) runner would fail the asset compile.
    runs-on: macos-26
    # Same CI footgun mobile-android.yml documents: CNG regenerates ios/ every run and node_modules
    # is restored from cache, all with fresh mtimes, so ccache's defaults would miss nearly every
    # object. Hash the compiler by CONTENT, and add the Xcode-specific sloppiness + depend-mode set
    # from RN's build-speed docs — clang-modules compiles (this app injects use_modular_headers!,
    # see app.config.ts) are only cacheable at all with depend_mode plus `modules`/`pch_defines`
    # sloppiness, and Xcode's -ivfsoverlay/index-store args need their entries too. These env vars
    # override the ccache config the ccache-action writes.
    #
    # CCACHE_DIR is issue #46: every iOS build up to 2026-07-25 finished with `Cacheable calls: 0`
    # — ccache was never consulted once, despite pod install printing "[Ccache]: Setting CC, LD,
    # CXX & LDPLUSPLUS" and gym compiling 330 C/ObjC/C++ units. RN routes CC/CXX through
    # node_modules/react-native/scripts/xcode/ccache-clang.sh, which force-exports
    # CCACHE_CONFIGPATH to its OWN scripts/xcode/ccache.conf unless the variable is already set.
    # That file declares no cache_dir, so objects would land in ccache's default
    # (~/Library/Caches/ccache) while the action restores/saves/reports on $GITHUB_WORKSPACE/.ccache.
    # An explicit CCACHE_DIR outranks BOTH config files and pins every path to the one the action
    # actually persists. CCACHE_BINARY (set below, once ccache is installed) is the wrapper's other
    # trapdoor: it is `exec $CCACHE_BINARY clang "$@"`, so an empty value silently execs plain
    # clang and the build succeeds with no cache and no warning.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      CCACHE_FILECLONE: 'true'
      CCACHE_DEPEND: 'true'
      CCACHE_INODECACHE: 'true'
    steps:
      - uses: actions/checkout@v4

      # Compile cache for everything still built from source — expo-modules-core, codegen output,
      # and the autolinked pods; RN core + its third-party deps come prebuilt via the RCT_* flags
      # on the pod install step below. Must be installed BEFORE `pod install` — react_native_post_install probes
      # `command -v ccache` at pod-install time and only points CC/CXX at RN's ccache wrappers
      # (with the resolved CCACHE_BINARY path baked in) when the binary already exists.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mobile-ios
          # One platform, one arch (device arm64) — proportionally smaller than Android's
          # 4-ABI 5G. verbose:2 prints `ccache -s` in the post step so the real hit rate is
          # visible — read it together with the job-level CCACHE_* env above.
          max-size: 2G
          verbose: 2
          # Same rule as mobile-android.yml (issue #46): a tag ref is built once and never read
          # again, so saving to it only burns the repo's shared 10GB budget and evicts main's entry
          # — the only one a release build can actually restore.
          save: ${{ github.ref_type != 'tag' }}

      # react_native_post_install writes ccache's path into the Pods project as an Xcode BUILD
      # SETTING named CCACHE_BINARY, which is not exported into the environment of the compiler
      # tasks Xcode spawns — leaving `exec $CCACHE_BINARY clang "$@"` in RN's wrapper to run bare
      # clang. Exporting it as a real env var here (after the action above has installed ccache, so
      # `command -v` resolves) closes that gap. Harmless if Xcode does export the build setting:
      # both resolve to the same binary.
      - name: Export ccache's path for RN's ccache-clang wrapper
        run: echo "CCACHE_BINARY=$(command -v ccache)" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - uses: ./.github/actions/setup-yarn

      # apps/mobile imports @trm/proto, whose src/gen/** is buf-generated and gitignored (see
      # root CLAUDE.md) — without this, Metro fails to resolve the generated *_pb modules when
      # the Xcode build phase bundles the release JS.
      - run: yarn workspace @trm/proto generate

      # Yarn 4 defaults enableScripts to false, so @shopify/react-native-skia's postinstall
      # (which copies its prebuilt xcframeworks into libs/ios) never runs — the Xcode build
      # then fails to find the Skia binaries. Run its bin script manually instead of flipping
      # enableScripts repo-wide (that would also re-enable every other dependency's postinstall).
      - run: npx install-skia

      # Same BUILD_NUMBER + APP_VERSION axes as mobile-android.yml (docs/release/mobile-versioning.md)
      # — keeps CFBundleVersion in lockstep with versionCode and CFBundleShortVersionString with
      # versionName, so a `v<semver>+<build>` tag ships identical version metadata to both stores.
      # Branch pushes stay at the fallback (BUILD_NUMBER=1); TestFlight will reject a second upload
      # at the same build number, so don't tag-push twice without bumping +<build>. A tag push that
      # doesn't match the pattern must fail loudly rather than silently build with the fallback —
      # see mobile-android.yml's identical guard for why. A manual publish=true dispatch has no tag
      # to derive these from, so it must supply both build_number and app_version inputs instead —
      # same "fail loudly, don't fall back" reasoning.
      - name: Derive BUILD_NUMBER + APP_VERSION from the release tag
        id: build_number
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
              echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
              echo "value=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Tag '$GITHUB_REF_NAME' doesn't match v<semver>+<build> (e.g. v1.0.0+1) — refusing to build/publish with the dev fallback BUILD_NUMBER=1. Re-tag as v<semver>+<build>."
              exit 1
            fi
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            if [[ "${{ inputs.build_number }}" =~ ^[0-9]+$ ]]; then
              echo "value=${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::publish=true requires a numeric build_number input — got '${{ inputs.build_number }}'. Manual dispatch has no v<semver>+<build> tag to derive one from, and TestFlight will reject a re-used build number."
              exit 1
            fi
            if [[ "${{ inputs.app_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version=${{ inputs.app_version }}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::publish=true requires a semver app_version input (e.g. 1.0.0) — got '${{ inputs.app_version }}'."
              exit 1
            fi
          else
            echo "value=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Prebuild the iOS native project
        working-directory: apps/mobile
        # The runtime-version record shares this step so it shares its env verbatim: the fingerprint
        # is computed from the evaluated app config, so a record resolved under a different env
        # would name a runtime version this binary never asks for. Traceability only, never a gate
        # (issue #55) — compare it against mobile-ota.yml's runtime-versions.json; a publish whose
        # value differs is invisible to this build, which is the whole OTA failure mode.
        run: |
          npx expo prebuild --platform ios --no-install
          npx expo-updates runtimeversion:resolve --platform ios --workflow managed \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log("iOS runtimeVersion: `"+JSON.parse(s).runtimeVersion+"`"))' \
            >> "$GITHUB_STEP_SUMMARY" \
            || echo 'iOS runtimeVersion: could not be resolved (record only, build unaffected)' >> "$GITHUB_STEP_SUMMARY"
        env:
          TRM_SERVER_ORIGIN: ${{ vars.TRM_SERVER_ORIGIN }}
          TRM_GOOGLE_WEB_CLIENT_ID: ${{ vars.TRM_GOOGLE_WEB_CLIENT_ID }}
          TRM_GOOGLE_IOS_CLIENT_ID: ${{ vars.TRM_GOOGLE_IOS_CLIENT_ID }}
          # Sentry (issue #44) — every one optional; unset ⇒ the SDK is never initialised and the
          # upload steps no-op. TRM_SENTRY_* land in `extra` (runtime config, read by
          # src/config.ts) and so must appear in EVERY block that re-evaluates app.config.ts,
          # exactly like the Google client ids above.
          TRM_SENTRY_DSN: ${{ vars.TRM_SENTRY_DSN }}
          TRM_SENTRY_ENVIRONMENT: ${{ vars.TRM_SENTRY_ENVIRONMENT }}
          TRM_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.TRM_SENTRY_TRACES_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE }}
          # Source-map + debug-symbol upload, run by the Sentry build phase the config plugin
          # injects. With no auth token SENTRY_DISABLE_AUTO_UPLOAD keeps that phase from failing
          # the build for anyone without a Sentry account.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_MOBILE_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
          # iOS-only (unlike mobile-android.yml): the reversed Google OAuth client id becomes a
          # CFBundleURLScheme in Info.plist — without the real value, Google sign-in can never
          # return to the app (the placeholder fallback only exists to let builds run pre-P6).
          TRM_GOOGLE_IOS_URL_SCHEME: ${{ vars.TRM_GOOGLE_IOS_URL_SCHEME }}
          # Baked into Expo.plist as updates.url — unset would ship binaries pointing OTA checks
          # at app.config.ts's localhost dev default.
          TRM_OTA_URL: ${{ vars.TRM_OTA_URL }}
          # Baked as the expo-app-id request header (which app on the OTA server this binary asks
          # about). It is a runtimeVersion fingerprint input, so it MUST match mobile-ota.yml's
          # publish env — a store build without it targets a different runtime version than the
          # updates published with it, and would silently never see them.
          TRM_OTA_APP_ID: ${{ vars.TRM_OTA_APP_ID }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          APP_VERSION: ${{ steps.build_number.outputs.version }}

      # Keyed on the prebuild-generated Podfile (ios/ itself isn't committed — see the CNG note
      # above) PLUS yarn.lock: the Podfile is a near-static template — the actual pod set and
      # versions come from autolinking over node_modules — so with the Podfile alone in the key a
      # JS dep bump would restore the same stale exact-match forever and re-run the identical
      # delta `pod install` on every build without ever saving the updated Pods back.
      #
      # The `-v2-` namespace exists to make every pre-v0.2.18 entry unreachable, restore-keys
      # included: those caches hold Pods/ReactNativeCore-artifacts tarballs that
      # RCT_SYMBOLICATE_PREBUILT_FRAMEWORKS repacked with a dSYM nested inside React.framework, and
      # the build-time re-extract described in the strip step below would put it straight back into
      # a shipped .app. Bump the namespace again if anything else ever poisons a cached Pods tree.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
          key: cocoapods-v2-${{ hashFiles('apps/mobile/ios/Podfile') }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            cocoapods-v2-${{ hashFiles('apps/mobile/ios/Podfile') }}-
            cocoapods-v2-

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
        env:
          # Expo's Podfile template checks USE_CCACHE before Podfile.properties.json's
          # apple.ccacheEnabled when deciding whether react_native_post_install wires CC/CXX to
          # RN's ccache wrappers. Deliberately env-only, NOT expo-build-properties'
          # ios.ccacheEnabled: that would change the resolved app config and shift the OTA
          # runtimeVersion fingerprint — exactly what .fingerprintignore keeps RNRepo's
          # prebuilt-vs-source choice from doing — cutting already-shipped binaries off from
          # JS-only OTA fixes until the next store build. A pod-install-time env var is invisible
          # to the fingerprint, and a no-op wherever ccache isn't installed.
          USE_CCACHE: '1'
          # RN 0.85's official prebuilt binaries (Meta-built, on Maven Central — verified present
          # for this exact RN version): core + the folly/glog/boost third-party deps skip the two
          # biggest source compiles outright. Both are read at pod-install time only, auto-revert to
          # building from source when the artifacts are missing (e.g. right after an RN bump, before
          # Meta publishes), and — like USE_CCACHE above — are invisible to the OTA runtimeVersion
          # fingerprint. The tarballs land in Pods/ReactNative{Core,Dependencies}-artifacts, so the
          # Pods cache above carries them across runs.
          #
          # RCT_SYMBOLICATE_PREBUILT_FRAMEWORKS is deliberately NOT set (it was, through
          # v0.2.17+17). Its one job is to fetch the matching dSYMs — but rncore.rb merges them
          # INTO the framework tarball, at React.xcframework/<slice>/React.framework/dSYMs, and
          # every copy that then reaches a shipped .app is an App Store Connect rejection
          # (ITMS 90171). The strip step below records why nothing downstream can undo that, so
          # React core symbolication stays off until upstream RN puts the dSYM beside the framework
          # instead of inside it. Expo's own pods already do it that way (<slice>/dSYMs) and are
          # unaffected.
          RCT_USE_PREBUILT_RNCORE: '1'
          RCT_USE_RN_DEP: '1'

      # A dSYM nested one level INSIDE a .framework bundle (rather than beside it, the way Apple's
      # xcframework DebugSymbolsPath convention and every Expo pod do it) rides along as ordinary
      # bundle content when Xcode embeds + codesigns that framework, and App Store Connect rejects
      # the shipped .app for it: "Invalid bundle structure", ITMS 90171. Three real upload attempts
      # mapped out where it can and cannot be undone:
      #
      #  - v0.1.14+14 #1 — RCT_SYMBOLICATE_PREBUILT_FRAMEWORKS put it there (react-native's
      #    scripts/cocoapods/rncore.rb, slice_dsym_dest) and the .app shipped it. Rejected.
      #  - v0.1.14+14 #2 — stripping it out of the already zipped-and-signed .ipa punches a hole in
      #    a seal Xcode had made over the folder: ITMS 90034, "Missing or invalid signature".
      #    Nothing may be removed after signing.
      #  - v0.2.17+17 — this step, stripping the unpacked Pods copy before xcodebuild, looked
      #    right (its find output proved all three React.xcframework slices went away) and the
      #    .app STILL shipped the dSYM. Cause: React-Core-prebuilt carries its own before_compile
      #    script phase ("[RNCore] Replace React Native Core for the right configuration", i.e.
      #    scripts/replace-rncore-version.js), which for a Release build wipes this directory and
      #    re-extracts the Release framework tarball over it — and the tarball is precisely what
      #    rncore.rb merged the dSYMs into. Whatever a pod-install-time cleanup does, the build
      #    undoes 12 seconds later. (v0.2.16+16 slipped through only because its restored Pods
      #    cache already carried a Release .last_build_configuration, so the re-extract no-oped.)
      #
      # So the fix is upstream of all of this: don't ask for the dSYMs at all (see the pod install
      # env above), which leaves nothing to strip anywhere. This step stays as a cheap tripwire —
      # it costs a second, its output is unconditional so a still-failing run has real on-disk
      # evidence instead of another guess, and with the flag unset it now prints nothing to remove.
      # The .ipa itself is asserted clean in the Fastfile, after gym and before pilot.
      - name: Strip nested dSYMs from vendored prebuilt frameworks (RN dSYM/codesign bug workaround)
        working-directory: apps/mobile/ios
        run: |
          echo "--- dSYM-related paths under Pods before cleanup ---"
          find Pods \( -iname 'dSYMs' -o -iname '*.dSYM' \) 2>/dev/null
          echo "--- stripping nested dSYMs dirs (path */<name>.framework/dSYMs) ---"
          find Pods -type d -path '*.framework/dSYMs' -print -exec rm -rf {} +
          echo "--- dSYM-related paths under Pods after cleanup (should exclude anything under a .framework) ---"
          find Pods \( -iname 'dSYMs' -o -iname '*.dSYM' \) 2>/dev/null

      # The Fastfile hardcodes workspace/scheme "TRMission" (derived from prebuild's
      # HelloWorld→sanitizedName rename). Assert it here so an Expo template change fails in
      # seconds with a directory listing, not 10+ minutes later inside xcodebuild.
      - name: Verify the Xcode workspace name the Fastfile expects
        run: |
          if [[ ! -d "apps/mobile/ios/TRMission.xcworkspace" ]]; then
            echo "::error::ios/TRMission.xcworkspace not found — prebuild's naming changed; update workspace:/scheme: in apps/mobile/fastlane/Fastfile"
            ls apps/mobile/ios
            exit 1
          fi

      # The Live Activity widget extension (issue #43) is injected into the CNG project by
      # plugins/withLiveActivity.js. If a future Expo template change makes that plugin a silent
      # no-op, the build would still succeed and ship an app whose Dynamic Island card simply never
      # appears — so assert the target and its sources here, where the failure is legible.
      - name: Verify the Live Activity widget target was injected
        run: |
          proj="apps/mobile/ios/TRMission.xcodeproj/project.pbxproj"
          for needle in "TRMissionWidget" "com.apple.product-type.app-extension" "TRMissionLiveActivityWidget.swift"; do
            if ! grep -q "$needle" "$proj"; then
              echo "::error::$needle missing from the generated Xcode project — withLiveActivity.js did not inject the widget extension"
              exit 1
            fi
          done
          for f in TRMissionWidgetBundle.swift TRMissionLiveActivityWidget.swift TRMissionActivityAttributes.swift TRMissionWidget-Info.plist; do
            if [[ ! -f "apps/mobile/ios/TRMissionWidget/$f" ]]; then
              echo "::error::apps/mobile/ios/TRMissionWidget/$f was not copied by withLiveActivity.js"
              ls -R apps/mobile/ios/TRMissionWidget || true
              exit 1
            fi
          done
          if ! grep -q "NSSupportsLiveActivities" apps/mobile/ios/TRMission/Info.plist; then
            echo "::error::NSSupportsLiveActivities missing from the app Info.plist — ActivityKit will refuse to start an activity"
            exit 1
          fi

      # upload:true on a real release tag, or on a manual dispatch with publish=true (which supplies
      # its own build_number input above) — a plain branch push or a dispatch without publish
      # carries the fallback BUILD_NUMBER=1, which TestFlight would reject as a duplicate after the
      # first upload.
      - name: Build (and on a release tag or publish=true dispatch, upload to TestFlight)
        working-directory: apps/mobile
        run: bundle exec fastlane ios beta upload:${{ github.ref_type == 'tag' || inputs.publish == true }}
        env:
          # The SAME app-config env as the prebuild step above — the runtime
          # `Constants.expoConfig.extra` is NOT baked at prebuild: expo-constants' Xcode script
          # phase re-evaluates app.config.ts DURING this gym build and serializes the result
          # into the app bundle (and expo-updates embeds its manifest the same way). Scoping
          # these vars to prebuild only shipped binaries with empty extra.google*ClientId,
          # which is exactly the gate that hides the Google sign-in button (LoginScreen's
          # `!!GOOGLE_WEB_CLIENT_ID`). Keep both env blocks in lockstep.
          TRM_SERVER_ORIGIN: ${{ vars.TRM_SERVER_ORIGIN }}
          TRM_GOOGLE_WEB_CLIENT_ID: ${{ vars.TRM_GOOGLE_WEB_CLIENT_ID }}
          TRM_GOOGLE_IOS_CLIENT_ID: ${{ vars.TRM_GOOGLE_IOS_CLIENT_ID }}
          # Sentry (issue #44) — every one optional; unset ⇒ the SDK is never initialised and the
          # upload steps no-op. TRM_SENTRY_* land in `extra` (runtime config, read by
          # src/config.ts) and so must appear in EVERY block that re-evaluates app.config.ts,
          # exactly like the Google client ids above.
          TRM_SENTRY_DSN: ${{ vars.TRM_SENTRY_DSN }}
          TRM_SENTRY_ENVIRONMENT: ${{ vars.TRM_SENTRY_ENVIRONMENT }}
          TRM_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.TRM_SENTRY_TRACES_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE }}
          # Source-map + debug-symbol upload, run by the Sentry build phase the config plugin
          # injects. With no auth token SENTRY_DISABLE_AUTO_UPLOAD keeps that phase from failing
          # the build for anyone without a Sentry account.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_MOBILE_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
          TRM_GOOGLE_IOS_URL_SCHEME: ${{ vars.TRM_GOOGLE_IOS_URL_SCHEME }}
          TRM_OTA_URL: ${{ vars.TRM_OTA_URL }}
          TRM_OTA_APP_ID: ${{ vars.TRM_OTA_APP_ID }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          APP_VERSION: ${{ steps.build_number.outputs.version }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: trmission-release-ipa
          path: apps/mobile/build/*.ipa
          if-no-files-found: error
