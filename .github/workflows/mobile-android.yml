name: mobile-android

# Continuous Native Generation: android/ is produced by `expo prebuild` here, never committed.
# Signing is self-managed (no EAS) via AGP's injected-signing properties.
on:
  push:
    branches: ['release/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload this build to Play's internal testing track"
        type: boolean
        default: false
      build_number:
        description: 'BUILD_NUMBER (versionCode) to stamp — required when publish is enabled, since a manual run has no v<semver>+<build> tag to derive one from (docs/release/mobile-versioning.md)'
        type: string
        default: ''
      app_version:
        description: 'APP_VERSION (versionName, e.g. 1.0.0) to stamp — required when publish is enabled, since a manual run has no v<semver>+<build> tag to derive one from (docs/release/mobile-versioning.md)'
        type: string
        default: ''
  # Actions caches are scoped per ref, and a run can only read its OWN ref's caches plus the
  # default branch's — so a cache saved on refs/tags/v0.1.15+15 is unreadable by every later tag.
  # The ONLY ccache entry any release build can restore is the one a main-branch run leaves behind,
  # which is what this warm-up is for. It runs the cheap 2-ABI dev path (non-tag ⇒ TRM_ANDROID_ABIS
  # scoped down, BUILD_NUMBER=1) and never publishes to Play (every publish step is gated on
  # github.ref_type == 'tag' or a manual publish=true dispatch). Daily, not twice-weekly (issue
  # #46): the shared 10GB repo cache budget means the entry is LRU-evicted long before GitHub's
  # 7-day idle expiry — the 2026-07-23 warm-up was gone within 17h, and every release build from
  # then on compiled cold at 0% hits.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # ccache defaults to compiler_check=mtime, but this workflow regenerates android/ (CNG),
    # restores node_modules from cache, and re-provisions the NDK toolchain every run — all with
    # fresh mtimes — so the default treats the compiler/inputs as changed and misses nearly every
    # object. Hash the compiler by CONTENT, and tell ccache that __DATE__/__TIME__ and include-file
    # timestamps are not real inputs, so cached objects actually survive across runs. RN's
    # build-speed docs call out this exact CI footgun. These env vars override the ccache config
    # the ccache-action writes. NOTE (issue #46): these are necessary but not sufficient — a 0%
    # hit rate here is almost always the GitHub cache layer, not ccache's config. Check the
    # ccache-action's "Restore cache" group FIRST: "No cache found" means there was nothing to hit
    # and `ccache -s` is just reporting that faithfully.
    env:
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships ~70GB of preinstalled tooling this JS/Android/Ruby pipeline never
      # touches (.NET, Haskell, CodeQL, Docker images, ...), leaving only ~14GB free. Compiling
      # react-native-skia's native code for all 4 ABIs plus the release bundling step exhausts
      # that, failing packageReleaseBundle with "No space left on device". Reclaim space up
      # front rather than dropping build architectures (a product-facing device-support call).
      - name: Free up disk space for the native build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /

      # ccache hashes each compiler invocation's preprocessed source, so it survives android/ being
      # regenerated from scratch every run by expo prebuild (CNG, gitignored — see top-of-file note),
      # unlike a plain directory cache keyed on file mtimes. This is what actually cuts the ~26-32min
      # native-build phase: the ~9 autolinked native modules (Skia bindings, Reanimated, Worklets,
      # gesture-handler, screens, expo-modules-core, ...) recompile identical C++ on every run today.
      # One shared key (not split by tag vs workflow_dispatch) lets a 2-ABI dev build's objects serve
      # as partial hits for a 4-ABI release build and vice versa.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mobile-android
          # 2G thrashed: 4 ABIs × the C++-heavy modules (Skia alone is large) evict each other
          # inside the cache even on a warm restore. verbose:2 prints `ccache -s` in the post step
          # so the real hit rate is visible — read it together with the job-level CCACHE_* env above.
          max-size: 5G
          verbose: 2
          # Restore everywhere, save only from a branch (issue #46). A tag ref is built once and
          # never again, so its ~280MB save is unreadable by every future run — while still
          # counting against the repo's shared 10GB cache budget and pushing the one entry that
          # IS readable (main's, from the warm-up above) further down the LRU eviction queue.
          # Branch refs keep saving: release/** gets pushed repeatedly and can reuse its own.
          save: ${{ github.ref_type != 'tag' }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - uses: ./.github/actions/setup-yarn

      # apps/mobile imports @trm/proto, whose src/gen/** is buf-generated and gitignored (see
      # root CLAUDE.md) — without this, Metro fails to resolve the generated *_pb modules when
      # Gradle's createBundleReleaseJsAndAssets task bundles the release JS.
      - run: yarn workspace @trm/proto generate

      # Yarn 4 defaults enableScripts to false, so @shopify/react-native-skia's postinstall
      # (which copies its prebuilt libskia.a et al into libs/android) never runs — CMake then
      # fails with "Skia prebuilt binaries not found". Run its bin script manually instead of
      # flipping enableScripts repo-wide (that would also re-enable every other dependency's
      # postinstall).
      - run: npx install-skia

      # BUILD_NUMBER is versionCode/CFBundleVersion and APP_VERSION is versionName/
      # CFBundleShortVersionString (docs/release/mobile-versioning.md): a `v<semver>+<build>` tag
      # carries real values for both; a manual publish=true dispatch must supply build_number and
      # app_version inputs instead (there's no tag to derive them from); everything else stays at
      # the dev BUILD_NUMBER fallback (1) and is never published to Play (see the publish step's
      # `if:` below). Both the tag and manual-dispatch paths fail loudly rather than silently fall
      # back to 1: versionCode 1 is always already taken (the mandatory manual bootstrap upload,
      # docs/release/play-console-setup.md Step 5, consumes it), so a silent fallback just wastes a
      # full ~30min build before Play's upload step rejects it with "Version code 1 has already been used".
      - name: Derive BUILD_NUMBER + APP_VERSION from the release tag
        id: build_number
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
              echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
              echo "value=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Tag '$GITHUB_REF_NAME' doesn't match v<semver>+<build> (e.g. v1.0.0+1) — refusing to build/publish with the dev fallback BUILD_NUMBER=1, which Play will reject as already used. Re-tag as v<semver>+<build>."
              exit 1
            fi
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            if [[ "${{ inputs.build_number }}" =~ ^[0-9]+$ ]]; then
              echo "value=${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::publish=true requires a numeric build_number input — got '${{ inputs.build_number }}'. Manual dispatch has no v<semver>+<build> tag to derive one from, and Play will reject a re-used versionCode."
              exit 1
            fi
            if [[ "${{ inputs.app_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version=${{ inputs.app_version }}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::publish=true requires a semver app_version input (e.g. 1.0.0) — got '${{ inputs.app_version }}'."
              exit 1
            fi
          else
            echo "value=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Prebuild the Android native project
        working-directory: apps/mobile
        # The runtime-version record shares this step so it shares its env verbatim: the fingerprint
        # is computed from the evaluated app config, so a record resolved under a different env
        # would name a runtime version this binary never asks for. Traceability only, never a gate
        # (issue #55) — compare it against mobile-ota.yml's runtime-versions.json; a publish whose
        # value differs is invisible to this build, which is the whole OTA failure mode.
        run: |
          npx expo prebuild --platform android --no-install
          npx expo-updates runtimeversion:resolve --platform android --workflow managed \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log("Android runtimeVersion: `"+JSON.parse(s).runtimeVersion+"`"))' \
            >> "$GITHUB_STEP_SUMMARY" \
            || echo 'Android runtimeVersion: could not be resolved (record only, build unaffected)' >> "$GITHUB_STEP_SUMMARY"
        env:
          TRM_SERVER_ORIGIN: ${{ vars.TRM_SERVER_ORIGIN }}
          TRM_GOOGLE_WEB_CLIENT_ID: ${{ vars.TRM_GOOGLE_WEB_CLIENT_ID }}
          TRM_GOOGLE_IOS_CLIENT_ID: ${{ vars.TRM_GOOGLE_IOS_CLIENT_ID }}
          # Sentry (issue #44) — every one optional; unset ⇒ the SDK is never initialised and the
          # upload steps no-op. TRM_SENTRY_* land in `extra` (runtime config, read by
          # src/config.ts) and so must appear in EVERY block that re-evaluates app.config.ts,
          # exactly like the Google client ids above.
          TRM_SENTRY_DSN: ${{ vars.TRM_SENTRY_DSN }}
          TRM_SENTRY_ENVIRONMENT: ${{ vars.TRM_SENTRY_ENVIRONMENT }}
          TRM_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.TRM_SENTRY_TRACES_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE }}
          # Source-map + debug-symbol upload, run by the Sentry build phase the config plugin
          # injects. With no auth token SENTRY_DISABLE_AUTO_UPLOAD keeps that phase from failing
          # the build for anyone without a Sentry account.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_MOBILE_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
          # Baked into AndroidManifest as expo-updates' URL — unset would ship binaries pointing
          # OTA checks at app.config.ts's localhost dev default.
          TRM_OTA_URL: ${{ vars.TRM_OTA_URL }}
          # Baked as the expo-app-id request header (which app on the OTA server this binary asks
          # about). It is a runtimeVersion fingerprint input, so it MUST match mobile-ota.yml's
          # publish env — a store build without it targets a different runtime version than the
          # updates published with it, and would silently never see them.
          TRM_OTA_APP_ID: ${{ vars.TRM_OTA_APP_ID }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          APP_VERSION: ${{ steps.build_number.outputs.version }}
          # Only a real v* tag reaches Play (see the publish step's `if:` below) — everything else
          # (workflow_dispatch, release/** pushes) just needs a build to exist, so scope those down
          # to one physical-device ABI + one emulator ABI. Profiling showed the ~9 native modules'
          # (Skia bindings, Reanimated, Worklets, ...) serialized per-ABI CMake builds eating ~26 of
          # ~34min; halving the ABI count roughly halves that. app.config.ts's withGradleProperties
          # turns this into the generated gradle.properties' `reactNativeArchitectures`.
          TRM_ANDROID_ABIS: ${{ github.ref_type != 'tag' && 'arm64-v8a,x86_64' || '' }}

      # Deferred until after prebuild: android/ is CNG output (gitignored, never committed — see the
      # top-of-file note) and doesn't exist until the prebuild step above runs. setup-java provides
      # the JDK only; Gradle caching moves to setup-gradle below.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Richer caching than setup-java's `cache: gradle` (which only caches downloaded deps):
      # setup-gradle persists the Gradle User Home AND wires a local build cache that the
      # `--build-cache` flag (below) reads, keyed on task INPUTS rather than file mtimes — so task
      # outputs (Kotlin/Java compile, resource merge, dex) survive across runs. The per-ABI CMake
      # native compile stays ccache's job.
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Without --parallel, Gradle runs one task at a time across the whole module graph even
      # though the per-ABI native (CMake/ninja) builds for the ~9 native modules (Skia bindings,
      # Reanimated, Worklets, gesture-handler, screens, expo-modules-core, ...) have no
      # dependencies on each other. Profiling a run showed that fully serial native-build phase
      # alone eating ~26 of the ~34min total. --build-cache lets task outputs (compile, resource
      # merge, dex) persist across runs too, riding the local build cache that setup-gradle (above)
      # restores/saves.
      #
      # -x lintVitalRelease skips Android's release lint — a multi-minute task, and the one that
      # forced app.config.ts's metaspace bump to stop it OOMing. JS/TS lint is already gated in
      # mobile-ci.yml; the native lint here mostly flags manifest/resource issues, an acceptable
      # trade for release-build speed.
      - name: Build the signed AAB
        working-directory: apps/mobile/android
        env:
          # CMake (>=3.4) seeds CMAKE_<LANG>_COMPILER_LAUNCHER from these env vars on first configure,
          # applying to every autolinked module's externalNativeBuild without patching their
          # node_modules build.gradle files individually.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # The SAME app-config env as the prebuild step above — the runtime
          # `Constants.expoConfig.extra` is NOT baked at prebuild: expo-constants' Gradle task
          # re-evaluates app.config.ts DURING this build and serializes the result into the app's
          # assets (and expo-updates embeds its manifest the same way). Scoping these vars to
          # prebuild only shipped binaries with empty extra.google*ClientId, which is exactly the
          # gate that hides the Google sign-in button (LoginScreen's `!!GOOGLE_WEB_CLIENT_ID`).
          # Keep both env blocks in lockstep.
          TRM_SERVER_ORIGIN: ${{ vars.TRM_SERVER_ORIGIN }}
          TRM_GOOGLE_WEB_CLIENT_ID: ${{ vars.TRM_GOOGLE_WEB_CLIENT_ID }}
          TRM_GOOGLE_IOS_CLIENT_ID: ${{ vars.TRM_GOOGLE_IOS_CLIENT_ID }}
          # Sentry (issue #44) — every one optional; unset ⇒ the SDK is never initialised and the
          # upload steps no-op. TRM_SENTRY_* land in `extra` (runtime config, read by
          # src/config.ts) and so must appear in EVERY block that re-evaluates app.config.ts,
          # exactly like the Google client ids above.
          TRM_SENTRY_DSN: ${{ vars.TRM_SENTRY_DSN }}
          TRM_SENTRY_ENVIRONMENT: ${{ vars.TRM_SENTRY_ENVIRONMENT }}
          TRM_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.TRM_SENTRY_TRACES_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_SAMPLE_RATE }}
          TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE: ${{ vars.TRM_SENTRY_REPLAY_ERROR_SAMPLE_RATE }}
          # Source-map + debug-symbol upload, run by the Sentry build phase the config plugin
          # injects. With no auth token SENTRY_DISABLE_AUTO_UPLOAD keeps that phase from failing
          # the build for anyone without a Sentry account.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_MOBILE_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
          TRM_OTA_URL: ${{ vars.TRM_OTA_URL }}
          TRM_OTA_APP_ID: ${{ vars.TRM_OTA_APP_ID }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          APP_VERSION: ${{ steps.build_number.outputs.version }}
          TRM_ANDROID_ABIS: ${{ github.ref_type != 'tag' && 'arm64-v8a,x86_64' || '' }}
        run: |
          ./gradlew :app:bundleRelease -x lintVitalRelease --parallel --build-cache \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - uses: actions/upload-artifact@v4
        with:
          name: trmission-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # A real release tag publishes automatically; a manual workflow_dispatch run can also publish
      # by setting publish=true (plus build_number, since there's no tag to derive one from) — e.g.
      # to re-upload after a rejected build without cutting a new tag. See
      # docs/release/play-console-setup.md for the one-time Play Console + service-account setup
      # this depends on. Always the internal track only; promote to production locally with
      # `fastlane android promote` once the track is verified.
      - name: Decode the Play service account key
        if: github.ref_type == 'tag' || inputs.publish == true
        run: echo "${{ secrets.PLAY_JSON_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/play-key.json"

      - name: Upload to Play's internal testing track
        if: github.ref_type == 'tag' || inputs.publish == true
        working-directory: apps/mobile
        run: bundle exec fastlane android internal
        env:
          PLAY_JSON_KEY_FILE: ${{ runner.temp }}/play-key.json
