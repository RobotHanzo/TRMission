# TRMission infrastructure.
#
#   docker compose up -d mongo                        # dev DB only (run server/web via `yarn dev`)
#   docker compose --profile dev-server up --build    # mongo + server + vite web dev (http://localhost:5173)
#   docker compose --profile full up --build          # full stack: mongo + server + web
#   docker compose --profile monitoring up -d         # prometheus + grafana (see monitoring/)
#
# The dev-server profile reads env from apps/server/.env (copy .env.example to get started).
# MONGO_URL is overridden to reach the mongo container — all other vars come from your .env file.
#
# Step C uses a standalone MongoDB — the persistence layer is single-writer-per-game
# and needs no multi-document transactions yet.
#
# The monitoring profile scrapes apps/server's unauthenticated GET /metrics
# (apps/server/src/observability/metrics.controller.ts) via Prometheus and ships a
# pre-provisioned Grafana dashboard (monitoring/grafana/dashboards/trmission-server.json).
# monitoring/prometheus/prometheus.yml targets host.docker.internal:3001, i.e. a server
# started on the host via `yarn workspace @trm/server dev` — repoint it at `server:3001`
# if you're scraping the `full` profile's containerized server instead.
# GRAFANA_ADMIN_PASSWORD must be set to a real password — there is no insecure default, and the
# grafana service's entrypoint refuses to start otherwise (see its definition below).
services:
  mongo:
    image: mongo:7
    container_name: trm-mongo
    ports:
      - '27017:27017'
    volumes:
      - trm-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev server: reads config from apps/server/.env, overrides MONGO_URL for the Docker network,
  # and runs with --watch for hot-reload.
  # Source files are bind-mounted for live sync; named volumes shield the container's
  # node_modules and generated proto files from being overwritten by the host tree.
  dev-server:
    profiles: ['dev-server']
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: yarn workspace @trm/server dev
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      - trm-node-modules:/app/node_modules
      - trm-yarn-state:/app/.yarn
      - trm-proto-gen:/app/packages/proto/src/gen
    restart: unless-stopped

  # Vite dev server: proxies /api + /ws to the dev-server container.
  # VITE_SERVER_HOST routes the proxy to the Docker service name instead of localhost.
  web-dev:
    profiles: ['dev-server']
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: deps
    command: yarn workspace @trm/web dev
    environment:
      VITE_SERVER_HOST: dev-server
    depends_on:
      - dev-server
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - trm-node-modules:/app/node_modules
      - trm-yarn-state:/app/.yarn
      - trm-proto-gen:/app/packages/proto/src/gen
    restart: unless-stopped

  server:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: '3001'
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: trmission
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      # Cross-origin browser clients only: the web container serves the SPA and proxies /api + /ws
      # from one origin, so same-origin play needs no entry here (the ws upgrade admits same-origin
      # requests itself; REST CORS never engages). Override for a real deployment's public origin.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Refresh/OAuth-nonce cookies get Secure by default (assumes HTTPS in front of this
      # container, e.g. a TLS-terminating proxy). Only set to 0 for an http-only deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # Auth-method toggles (default on). Set to 0 to disable.
      AUTH_PASSWORD_LOGIN_ENABLED: ${AUTH_PASSWORD_LOGIN_ENABLED:-1}
      AUTH_GUEST_ENABLED: ${AUTH_GUEST_ENABLED:-1}
      # OAuth — a provider is enabled only when both id+secret are set. The web app + API must be
      # the same origin (nginx serves both here), so the Strict refresh cookie survives the callback.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:8080}
      # Universal/App Link identities: nginx proxies /.well-known/* here, and the controller
      # 404s until these are set (apps/server/CLAUDE.md). APPLE_APP_ID is "TEAMID.bundle.id";
      # ANDROID_CERT_SHA256 is the comma-separated Play App Signing cert fingerprint list.
      APPLE_APP_ID: ${APPLE_APP_ID:-}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      # Maintainer dashboard: comma-separated users._id values (NOT emails) granted the owner
      # role at boot (accounts must already be registered; served at /admin/ by the web container).
      DASHBOARD_OWNER_IDS: ${DASHBOARD_OWNER_IDS:-}
      # Sentry (issue #44) — entirely opt-in: an unset DSN means the SDK is never initialised.
      # SENTRY_TRACES_SAMPLE_RATE is 0–1 (default 0.1); /metrics and /healthz are never traced.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3001:3001'
    restart: unless-stopped

  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # The web + admin bundles are static: their Sentry config is BAKED AT BUILD TIME by Vite,
      # not read from the container's environment. A DSN is a public ingest endpoint, so shipping
      # it in the bundle is fine; changing it means rebuilding the image.
      args:
        SENTRY_DSN: ${WEB_SENTRY_DSN:-}
        ADMIN_SENTRY_DSN: ${ADMIN_SENTRY_DSN:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
        SENTRY_REPLAY_SAMPLE_RATE: ${SENTRY_REPLAY_SAMPLE_RATE:-}
        SENTRY_REPLAY_ERROR_SAMPLE_RATE: ${SENTRY_REPLAY_ERROR_SAMPLE_RATE:-}
    depends_on:
      - server
    ports:
      - '8080:80'
    restart: unless-stopped

  # Self-hosted expo-updates server for the mobile app (spec §10, expo-open-ota — see
  # docs/mobile/ota.md for the pinned upstream contract). JS/asset updates only (Apple 3.3.2);
  # native changes ship through the stores and are fenced by runtimeVersion=fingerprint.
  # Updates are SIGNED AT SERVE TIME: the code-signing private key is mounted read-only here
  # and must never be committed (apps/mobile/certs/keys/ is gitignored).
  ota:
    profiles: ['full']
    # PINNED, not floating (`latest` moves between incompatible generations): the deployment runs the
    # v3 line, where the server is multi-app — the app is selected by an `expo-app-id` request header
    # and uploads are app-scoped (<origin>/<appId>/requestUploadUrl/<branch>). The publish CLI in
    # mobile-ota.yml is pinned to the SAME version: they ship from one repo and only work in matched
    # pairs (docs/mobile/ota.md). The env below is the stateless-mode contract — v3 keeps serving
    # clients that send no app id by falling back to EXPO_APP_ID, which is what local dev builds are.
    image: ghcr.io/axelmarciano/expo-open-ota:v3.0.5
    environment:
      # Public origin clients reach this server at (updates.url = <BASE_URL>/manifest).
      BASE_URL: ${TRM_OTA_BASE_URL:-http://localhost:3005}
      # No insecure default: JWT_SECRET signs this server's own upload/dashboard tokens
      # (docs/mobile/ota.md), so an unset/placeholder value would let anyone reachable mint an
      # accepted upload token. The entrypoint below refuses to start unless a real secret is set.
      JWT_SECRET: ${TRM_OTA_JWT_SECRET:-}
      # Expo API is used only for publish auth + channel→branch mapping (npx eoas publish);
      # the update serving itself is fully self-hosted.
      EXPO_APP_ID: ${EXPO_APP_ID:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      CACHE_MODE: local
      STORAGE_MODE: local
      LOCAL_BUCKET_BASE_PATH: /updates
      KEYS_STORAGE_TYPE: local
      PUBLIC_LOCAL_EXPO_KEY_PATH: /keys/public-key.pem
      PRIVATE_LOCAL_EXPO_KEY_PATH: /keys/private-key.pem
    # The upstream image's own CMD is `/app/main` with no startup validation of JWT_SECRET, so an
    # unconfigured deployment would otherwise silently accept tokens signed with the (removed)
    # default above. Wrap it in a pre-flight check: refuse to exec the real server unless
    # TRM_OTA_JWT_SECRET is set to something other than the old committed placeholder.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -z "$$JWT_SECRET" ] || [ "$$JWT_SECRET" = "dev-insecure-change-me" ]; then
          echo 'FATAL: TRM_OTA_JWT_SECRET is unset (or still the old insecure placeholder). Set a real secret before starting the ota service — see docs/mobile/ota.md.' >&2
          exit 1
        fi
        exec /app/main
    volumes:
      - trm-ota-data:/updates
      - ./apps/mobile/certs/keys:/keys:ro
    ports:
      - '3005:3000'
    restart: unless-stopped

  prometheus:
    profiles: ['monitoring']
    image: prom/prometheus:latest
    container_name: trm-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - trm-prometheus-data:/prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    profiles: ['monitoring']
    image: grafana/grafana:latest
    container_name: trm-grafana
    depends_on:
      - prometheus
    environment:
      # No insecure default: an empty/unset value here falls straight through to Grafana's own
      # built-in "admin" password (verified against a real grafana/grafana:latest container — an
      # empty GF_SECURITY_ADMIN_PASSWORD does NOT refuse to start or generate a random password).
      # The entrypoint below refuses to start unless a real password is set.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    # The upstream image's own entrypoint (/run.sh) has no startup validation of
    # GF_SECURITY_ADMIN_PASSWORD, so an unconfigured deployment would otherwise silently boot with
    # the (removed) guessable "admin" default above. Wrap it in a pre-flight check: refuse to exec
    # the real entrypoint unless GRAFANA_ADMIN_PASSWORD is set to something other than "admin".
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ] || [ "$$GF_SECURITY_ADMIN_PASSWORD" = "admin" ]; then
          echo 'FATAL: GRAFANA_ADMIN_PASSWORD is unset (or the guessable "admin" default). Set a real password before starting the grafana service.' >&2
          exit 1
        fi
        exec /run.sh
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - trm-grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped

volumes:
  trm-mongo-data:
  trm-node-modules:
  trm-yarn-state:
  trm-proto-gen:
  trm-ota-data:
  trm-prometheus-data:
  trm-grafana-data:
